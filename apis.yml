aid: talos
name: Talos
description: >-
  Talos (Talos Global, Inc.) is the institutional platform to trade and manage
  digital assets across the full investment lifecycle. Founded in 2018 and
  headquartered in New York, NY, Talos unifies an order/execution management
  system (OEMS), a portfolio management system (PMS), and institutional market
  data on a single platform — covering price discovery, execution, portfolio
  construction, risk management, treasury, and settlement. Institutions such as
  hedge funds, banks, broker-dealers, asset managers, ETF issuers, and neobanks
  reach global liquidity through the Talos Network of 100+ providers (exchanges,
  OTC desks, prime brokers, custodians, DeFi protocols, and FX providers) and
  connect programmatically over FIX, REST, and WebSocket APIs. Developer
  documentation is gated behind client authentication (Auth0); this profile was
  enriched from Talos's public surface (llms.txt, GitHub org, and trust center).
